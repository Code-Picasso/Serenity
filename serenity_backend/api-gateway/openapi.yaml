openapi: 3.0.3
info:
  title: Serenity API
  description: |
    Unified API surface for the Serenity backend. All services are exposed
    through the gateway at `http://localhost:8000`. Protect routes with a
    `Bearer <accessToken>` header (see the Auth section).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local docker-compose gateway
tags:
  - name: Auth
  - name: Feed
  - name: Posts
  - name: Users
  - name: Chat
  - name: Notifications
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Auth]
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an account with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201':
          description: Created, returns tokens and user
        '409':
          description: Email already registered
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Returns access + refresh tokens
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
  /feed:
    get:
      tags: [Feed]
      summary: Personalised feed for the current user
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: topic
          schema: { type: string }
      responses:
        '200':
          description: Paginated feed items
  /feed/search:
    get:
      tags: [Feed]
      summary: Search articles across aggregated sources
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Search results
  /feed/topics:
    get:
      tags: [Feed]
      summary: Interest catalog grouped into sections (news, sports, entertainment, social, humor)
      responses:
        '200':
          description: Grouped topic sections plus a flattened topic list
  /posts:
    post:
      tags: [Posts]
      summary: Create a text/image post
      responses:
        '201':
          description: Created post
    get:
      tags: [Posts]
      summary: List posts for the feed
      responses:
        '200':
          description: Posts
  /posts/{id}/save:
    post:
      tags: [Posts]
      summary: Save a post/article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saved
  /posts/{id}/reshare:
    post:
      tags: [Posts]
      summary: Reshare a post/article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reshared
  /users/top-readers:
    get:
      tags: [Users]
      summary: Discover top readers by activity
      responses:
        '200':
          description: Ranked users
  /users/me:
    get:
      tags: [Users]
      summary: Current user profile
      responses:
        '200':
          description: Profile
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      responses:
        '200':
          description: Notifications
